name: Deploy staging
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Successful CI run ID that contains the reviewed app and migration artifacts'
        type: string
        required: true
      reviewed_migrations:
        description: 'Confirm you inspected migrations.sql and approve this exact migration bundle'
        type: boolean
        required: true
        default: false
      migration_id:
        description: 'Migration ID shown in the CI artifact manifest'
        type: string
        required: true
      migration_sha256:
        description: 'SHA-256 of the efbundle in that CI run, shown in its run summary'
        type: string
        required: true
permissions:
  contents: read
  id-token: write
  actions: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Check required configuration and CI run
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          DB_CONNECTION: ${{ secrets.AZURE_SQL_MIGRATION_CONNECTION }}
          MIGRATION_ID: ${{ inputs.migration_id }}
          MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
          MIGRATIONS_REVIEWED: ${{ inputs.reviewed_migrations }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          RG_NAME: ${{ vars.AZURE_RESOURCE_GROUP }}
          SQL_SERVER: ${{ vars.AZURE_SQL_SERVER_NAME }}
        run: |
          missing=0
          if [ "$MIGRATIONS_REVIEWED" != "true" ]; then echo '::error::Dispatch must explicitly confirm reviewed_migrations=true.'; missing=1; fi
          for key in CI_RUN_ID DB_CONNECTION MIGRATION_ID MIGRATION_SHA256 CLIENT_ID TENANT_ID SUBSCRIPTION_ID APP_NAME RG_NAME SQL_SERVER; do
            if [ -z "${!key}" ]; then echo "::error::Missing required configuration: $key"; missing=1; fi
          done
          if ! [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]; then echo '::error::ci_run_id must be numeric.'; missing=1; fi
          if ! [[ "$MIGRATION_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then echo '::error::migration_sha256 must contain 64 hexadecimal characters.'; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > /tmp/ci-run.json
          run_name="$(jq -r '.name' /tmp/ci-run.json)"
          run_status="$(jq -r '.status' /tmp/ci-run.json)"
          run_conclusion="$(jq -r '.conclusion' /tmp/ci-run.json)"
          run_event="$(jq -r '.event' /tmp/ci-run.json)"
          run_sha="$(jq -r '.head_sha' /tmp/ci-run.json)"
          if [ "$run_name" != 'CI' ] || [ "$run_status" != 'completed' ] || [ "$run_conclusion" != 'success' ] || [ "$run_event" = 'pull_request' ] || [ "$run_sha" != "$GITHUB_SHA" ]; then
            echo '::error::Select a completed successful push/manual CI run for this exact commit; PR runs cannot be deployed.'
            exit 1
          fi
      - name: Download artifact from reviewed CI run
        uses: actions/download-artifact@v4
        with:
          name: ci-release
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify exact migration artifact
        env:
          MIGRATION_ID: ${{ inputs.migration_id }}
          MIGRATION_SHA256: ${{ inputs.migration_sha256 }}
        run: |
          test -s release/migrations/efbundle
          test -s release/migrations/migrations.sql
          grep -Fxq "source_sha=$GITHUB_SHA" release/migrations/manifest.txt
          grep -Fxq "migration_id=$MIGRATION_ID" release/migrations/manifest.txt
          expected="$(sed -n 's/^bundle_sha256=//p' release/migrations/manifest.txt)"
          actual="$(sha256sum release/migrations/efbundle | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ] || [ "${actual,,}" != "${MIGRATION_SHA256,,}" ]; then echo '::error::Migration bundle digest does not match the reviewed CI artifact.'; exit 1; fi
          grep -Fxq "$MIGRATION_ID" release/migrations/migrations.txt || { echo '::error::Migration ID is missing from the artifact list.'; exit 1; }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Open SQL firewall for this runner
        id: sql_firewall
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SQL_SERVER: ${{ vars.AZURE_SQL_SERVER_NAME }}
        run: |
          ip="$(curl -fsS https://api.ipify.org)"
          if ! [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then echo '::error::Could not determine a valid runner IPv4 address.'; exit 1; fi
          rule="gha-${GITHUB_RUN_ID}"
          az sql server firewall-rule create --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$rule" --start-ip-address "$ip" --end-ip-address "$ip"
          echo "rule=$rule" >> "$GITHUB_OUTPUT"
      - name: Apply reviewed migration bundle
        env:
          DB_CONNECTION: ${{ secrets.AZURE_SQL_MIGRATION_CONNECTION }}
        run: release/migrations/efbundle --connection "$DB_CONNECTION"
      - name: Close SQL firewall for this runner
        if: ${{ always() && steps.sql_firewall.outputs.rule != '' }}
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SQL_SERVER: ${{ vars.AZURE_SQL_SERVER_NAME }}
          RULE_NAME: ${{ steps.sql_firewall.outputs.rule }}
        run: az sql server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server "$SQL_SERVER" --name "$RULE_NAME"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release/app
      - name: Health and smoke checks
        env:
          URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
        run: |
          curl --fail --retry 10 --retry-delay 6 "$URL/health/live"
          curl --fail --retry 10 --retry-delay 6 "$URL/health/ready"
          curl --fail "$URL/"
