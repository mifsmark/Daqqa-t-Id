<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3e9" />
    <title>You’re offline · Daqqa t’Id</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        background: #f7f3e9;
        color: #183a37;
        font-family: system-ui, sans-serif;
      }
      .card {
        width: min(100%, 420px);
        padding: 28px;
        border-radius: 18px;
        background: #fffdf7;
        border: 1px solid #e8dfcc;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -1px;
      }
      p {
        line-height: 1.6;
        color: #60756d;
      }
      .mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50% 50% 50% 10px;
        background: #176b61;
        color: white;
        font-weight: 800;
      }
      .button {
        display: inline-block;
        margin-top: 10px;
        padding: 13px 18px;
        border-radius: 9px;
        background: #176b61;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">d</div>
      <h1>You’re offline right now.</h1>
      <p>
        Reconnect to browse helpers, send a request, or update your profile.
        Your account information is never saved for offline use.
      </p>
      <a class="button" href="/">Try again</a>
    </main>
  </body>
</html>
